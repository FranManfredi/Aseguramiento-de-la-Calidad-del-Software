plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'org.jetbrains.kotlinx.kover' version "0.9.7"
}

group = 'com.ingsis.grupo10'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

kover {
    reports {
        verify {
            rule {
                minBound(90)
            }
        }
    }
}