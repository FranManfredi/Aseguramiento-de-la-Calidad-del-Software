plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.0'
    id 'org.jetbrains.kotlinx.kover' version "0.9.7"
    id 'org.jlleitschuh.gradle.ktlint' version '14.2.0'
}

group = 'com.francisco.manfredi'
version = '0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.jetbrains.kotlin:kotlin-test'
}

test {
    useJUnitPlatform()
}

kotlin {
    jvmToolchain(21)
}

kover {
    reports {
        verify {
            rule {
                minBound(90)
            }
        }
    }
}
tasks.register('checkFixmes') {
    doLast {
        def todoPattern = ~/(?i)\bFIXME\b/
        def todos = []

        def files = fileTree(rootProject.layout.projectDirectory.asFile) {
            include '**/*.java'
            include '**/*.kt'
            include '**/*.groovy'
            include '**/*.gradle'
            exclude '**/build/**'
            exclude '**/.gradle/**'
        }

        files.each { file ->
            int lineNumber = 0
            file.eachLine { line ->
                lineNumber++
                if (line =~ todoPattern) {
                    todos << [
                            location: "${file.absolutePath}:${lineNumber}:1",
                            text    : line.trim()
                    ]
                }
            }
        }

        if (!todos.isEmpty()) {
            logger.quiet("")
            logger.quiet("FIXMEs encontrados:")
            todos.each {
                logger.quiet(it.location)
                logger.quiet("  ${it.text}")
            }
            logger.quiet("")

            throw new GradleException("Hay TODOs pendientes en el código.")
        }

        logger.lifecycle("No se encontraron TODOs")
    }
}